.ex-page, .ex-practice { color: var(--ink); min-width: 0; }
.ex-page { max-width: 1510px; margin-inline: auto; }
.ex-page h1 { font-size: clamp(2.25rem, 4.3vw, 4.5rem); line-height: 1.03; letter-spacing: -.055em; margin: .25em 0 .18em; }
.ex-page h2, .ex-practice h2 { margin: 0; letter-spacing: -.035em; }
.ex-page h3, .ex-practice h3 { margin: 0; }
.ex-page p, .ex-practice p { line-height: 1.55; }
.ex-head { padding-top: 1.8rem; margin-bottom: 1.7rem; }
.ex-head > p { font-size: 1.05rem; color: var(--muted); max-width: 68ch; margin: .6em 0; }
.ex-eyebrow, .ex-chip { font: 700 .7rem/1.4 'IBM Plex Mono', Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); }
.ex-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: clamp(.95rem, 2vw, 1.45rem); min-width: 0; }
.ex-card-head, .ex-actions, .ex-demo-row, .ex-legend, .ex-bank-tabs { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem; }
.ex-card-head { justify-content: space-between; align-items: flex-start; margin-bottom: .9rem; }
.ex-card-head p { margin: .25rem 0 0; color: var(--muted); font-size: .88em; }
.ex-explorer-grid { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(225px, .85fr); align-items: start; gap: 1rem; }
.ex-main, .ex-side { display: grid; gap: 1rem; min-width: 0; }
.ex-toggle { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 3px; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; }
.ex-toggle button, .ex-bank-tabs button { padding: .4rem .65rem; border: 1px solid transparent; color: var(--muted); background: transparent; border-radius: 6px; font: inherit; font-size: .85em; cursor: pointer; }
.ex-toggle button[aria-pressed="true"], .ex-bank-tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--line); background: var(--panel); box-shadow: 0 1px 3px #12282314; font-weight: 650; }
.ex-field { display: grid; gap: .28rem; font-size: .85em; font-weight: 550; color: var(--ink); min-width: 0; }
.ex-field > span:first-child { display: flex; gap: .4rem; justify-content: space-between; }
.ex-field output { color: var(--teal); font-family: 'IBM Plex Mono', Consolas, monospace; }
.ex-field input[type="range"] { width: 100%; margin: .25rem 0; accent-color: var(--teal); }
.ex-field select, .ex-field input:not([type="range"]), .ex-answer-input { width: 100%; font: inherit; color: var(--ink); background-color: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: .55rem .6rem; min-height: 36px; }
.ex-bounds { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin-block: .6rem; }
.ex-bounds .ex-field { font-weight: 500; }
.ex-small { font-size: .84em; color: var(--muted); }
.ex-small:empty { display: none; }
.ex-fieldset { display: grid; gap: .72rem; padding: 1rem 0; border-top: 1px solid var(--line); }
.ex-fieldset:first-child { border-top: 0; padding-top: 0; }
.ex-fieldset .ex-card-head { margin: 0; align-items: center; }
.ex-link-button { border: 0; padding: .2em 0; background: none; color: var(--teal); font: inherit; font-size: .87em; font-weight: 600; text-decoration: underline; text-underline-offset: .16em; cursor: pointer; }
.ex-line-key { flex: none; display: inline-block; width: 1.5em; height: 0; border-top: 3px solid var(--series); }
.ex-line-key.series-1 { border-top-style: dashed; }
.ex-line-key.series-2 { border-top-style: dotted; }
.ex-legend { font-size: .82em; color: var(--muted); }
.ex-legend > span { display: inline-flex; gap: .35em; align-items: center; }
.ex-plot { width: 100%; height: auto; display: block; overflow: visible; margin: .6rem 0; }
.ex-plot text { fill: var(--muted); font: 13px 'DM Sans', Arial, sans-serif; }
.ex-plot .ex-gridline { stroke: var(--line); stroke-width: 1; }
.ex-plot .ex-axisline { stroke: var(--muted); stroke-width: 1; }
.ex-scroll { overflow-x: auto; }
.ex-table { width: 100%; border-collapse: collapse; font-size: .87em; font-variant-numeric: tabular-nums; }
.ex-table th, .ex-table td { text-align: right; padding: .58rem .25rem; white-space: nowrap; border-bottom: 1px solid var(--line); }

<script>
/* math.js */
/* Probability models and experiment mechanisms. No DOM or external dependencies. */
(function (root) {
  'use strict';

  const LOG_SQRT_TWO_PI = 0.9189385332046727;
  const SQRT_TWO_PI = Math.sqrt(2 * Math.PI);
  const EPSILON = 3e-14;
  const TINY = 1e-300;
  const lanczos = [
    0.9999999999998099, 676.5203681218851, -1259.1392167224028,
    771.3234287776531, -176.6150291621406, 12.507343278686905,
    -0.13857109526572012, 9.984369578019572e-6, 1.5056327351493116e-7
  ];

  function finite(x, name) {
    if (!Number.isFinite(x)) throw new RangeError(name + ' must be finite');
  }

  function positive(x, name) {
    if (!Number.isFinite(x) || x <= 0) throw new RangeError(name + ' must be positive');
  }

  function integer(x, min, name) {
    if (!Number.isSafeInteger(x) || x < min) throw new RangeError(name + ' must be an integer ≥ ' + min);
  }

  function probability(x, name) {
    if (!Number.isFinite(x) || x < 0 || x > 1) throw new RangeError(name + ' must be in [0, 1]');
  }

    let state = 2166136261;

      state = (state + 0x6D2B79F5) >>> 0;
      let word = Math.imul(state ^ (state >>> 15), 1 | state);
      word ^= word + Math.imul(word ^ (word >>> 7), 61 | word);
      return (((word ^ (word >>> 14)) >>> 0) + 0.5) / 4294967296;

  function logGamma(z) {
    if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - logGamma(1 - z);
    const x = z - 1;
    let series = lanczos[0];
    for (let i = 1; i < lanczos.length; i++) series += lanczos[i] / (x + i);
    const t = x + 7.5;
    return LOG_SQRT_TWO_PI + (x + 0.5) * Math.log(t) - t + Math.log(series);

  // The correction to Stirling's log-gamma approximation, for x ≥ 8.
  function stirlingCorrection(x) {
    const z = 1 / (x * x);

      z * (-1 / 1680 + z * (1 / 1188 - z * 691 / 360360))))) / x;

  function logBeta(a, b) {
    // Shift small parameters before using ratios. This avoids subtracting
    // nearly equal log-gamma values for a large, asymmetric posterior.
    let adjustment = 0;
    while (a < 8) {
      adjustment += Math.log1p(b / a);
      a++;

    while (b < 8) {

      b++;
    }

      + LOG_SQRT_TWO_PI - 0.5 * Math.log(a + b)
      + stirlingCorrection(a) + stirlingCorrection(b) - stirlingCorrection(a + b);

  function nonzero(x) {
    if (Math.abs(x) >= TINY) return x;
    return x >= 0 ? TINY : -TINY;

  function clampProbability(x) {
    return Math.max(0, Math.min(1, x));
  }

  function gammaProbability(a, x, upper = false) {
    if (x <= 0) return upper ? 1 : 0;
    if (x === Infinity) return upper ? 0 : 1;
    const kernel = Math.exp(a * Math.log(x) - x - logGamma(a));
    if (x < a + 1) {
      let term = 1 / a;
      let sum = term;
      for (let i = 1; i <= 10000; i++) {

      const lower = sum * kernel;
      return clampProbability(upper ? 1 - lower : lower);

    let b = x + 1 - a;

    let fraction = d;
    for (let i = 1; i <= 10000; i++) {
      const coefficient = i * (a - i);
      b += 2;
      d = 1 / nonzero(b + coefficient * d);
      c = nonzero(b + coefficient / c);
      const update = c * d;
      fraction *= update;
      if (Math.abs(update - 1) <= EPSILON) break;

    let d = 1 / nonzero(1 - (a + b) * x / (a + 1));

  // Log samples preserve accuracy when Beta's gamma-ratio components are tiny.

      }

        };

      case 'gamma': {
        const { shape, rate } = p;
        positive(shape, 'shape');
        positive(rate, 'λ');
        const logScale = shape * Math.log(rate) - logGamma(shape);
        return {
          support: '[0, ∞)', domain: [0, (shape + 5 * Math.sqrt(shape)) / rate],
          mean: shape / rate, variance: shape / (rate * rate),
          pdf(x) {
            if (x < 0 || x === Infinity) return 0;
            if (x === 0) return shape < 1 ? Infinity : shape === 1 ? rate : 0;
            return Math.exp(logScale + (shape - 1) * Math.log(x) - rate * x);
          },
          cdf: x => gammaProbability(shape, rate * x),
          sample: random => Math.exp(logGammaSample(shape, random)) / rate
        };
      }
      case 'beta': {
        const { alpha, beta } = p;
        positive(alpha, 'α');
        positive(beta, 'β');
        const sum = alpha + beta;
        const mean = alpha / sum;
        const logB = logBeta(alpha, beta);
        return {
          support: '[0, 1]', domain: [0, 1], mean, variance: mean * (beta / sum) / (sum + 1),
          pdf(x) {
            if (x < 0 || x > 1) return 0;
            if (x === 0) return alpha < 1 ? Infinity : alpha === 1 ? beta : 0;
            if (x === 1) return beta < 1 ? Infinity : beta === 1 ? alpha : 0;
            return Math.exp((alpha - 1) * Math.log(x) + (beta - 1) * Math.log1p(-x) - logB);
          },
          cdf: x => betaCDF(alpha, beta, logB, x),
          sample: random => 1 / (1 + Math.exp(logGammaSample(beta, random) - logGammaSample(alpha, random)))
        };
      }
      default: throw new RangeError('Unknown distribution ' + family);
    }
  }

  function quantile(family, p, q) {
    probability(q, 'quantile probability');
    const distribution = model(family, p);
    if (family === 'uniform') return p.a + q * (p.b - p.a);
    if (family === 'exponential') return -Math.log1p(-q) / p.rate;
    if (family === 'lognormal') return Math.exp(quantile('normal', p, q));

    if (q === 1) return family === 'beta' ? 1 : Infinity;
    let [lo, hi] = distribution.domain;
    while (distribution.cdf(lo) > q) lo -= hi - lo;
    while (distribution.cdf(hi) < q) hi += hi - lo;
    for (let i = 0; i < 160; i++) {
      const mid = lo + (hi - lo) / 2;
      if (mid === lo || mid === hi) break;
      if (distribution.cdf(mid) < q) lo = mid;
      else hi = mid;
    }
    return lo + (hi - lo) / 2;
  }

  function binomialPMF(n, p, k) {
    integer(n, 0, 'n');
    probability(p, 'p');
    if (!Number.isInteger(k) || k < 0 || k > n) return 0;
    if (p === 0) return Number(k === 0);
    if (p === 1) return Number(k === n);
    return Math.exp(logGamma(n + 1) - logGamma(k + 1) - logGamma(n - k + 1) +
      k * Math.log(p) + (n - k) * Math.log1p(-p));
  }

  function trial(id, p, random) {
    switch (id) {
      case 'bridge':
      case 'galton': {
        integer(p.n, 1, 'n');
        if (!(p.p > 0 && p.p < 1)) throw new RangeError('Standardization requires 0 < p < 1');
        const steps = [];
        let k = 0;
        for (let i = 0; i < p.n; i++) {
          const right = Number(random() < p.p);
          steps.push(right);
          k += right;
        }
        return { value: (k - p.n * p.p) / Math.sqrt(p.n * p.p * (1 - p.p)), k, steps };
      }
      case 'measurement': {
        integer(p.effects, 1, 'effects');
        finite(p.mu, 'μ');
        positive(p.sigma, 'σ');
        // Each uniform contribution has variance σ²/m; independence adds variances.
        const halfWidth = p.sigma * Math.sqrt(3 / p.effects);
        const parts = [];
        let value = p.mu;
        for (let i = 0; i < p.effects; i++) {
          const error = (2 * random() - 1) * halfWidth;
          parts.push(error);
          value += error;
        }
        return { value, parts };
      }
      case 'lognormal': {
        integer(p.effects, 1, 'effects');
        finite(p.mu, 'log-time location μ');
        positive(p.sigma, 'log-time spread σ');
        const logMean = p.mu / p.effects;
        const logSpread = p.sigma / Math.sqrt(p.effects);
        const parts = [];
        let totalLog = 0;
        for (let i = 0; i < p.effects; i++) {
          const increment = logMean + logSpread * standardNormal(random);
          parts.push(increment);
          totalLog += increment;
        }
        return { value: Math.exp(totalLog), parts };
      }
      case 'uniform': {
        finite(p.a, 'a');
        finite(p.b, 'b');
        if (!(p.a < p.b)) throw new RangeError('Uniform endpoints require a < b');
        return { value: p.a + (p.b - p.a) * random() };
      }
      case 'exponential':
      case 'memory':
        positive(p.rate, 'λ');
        return { value: waitTime(p.rate, random) };
      case 'gamma': {
        integer(p.shape, 1, 'number of arrivals');
        positive(p.rate, 'λ');
        const times = [];
        let value = 0;
        for (let i = 0; i < p.shape; i++) {
          value += waitTime(p.rate, random);
          times.push(value);
        }
        return { value, times };
      }
      case 'beta':
        probability(p.truth, 'true success probability');
        return { value: Number(random() < p.truth) };
      default: throw new RangeError('Unknown experiment ' + id);
    }
  }

  function posterior(alpha, beta, successes, failures) {
    positive(alpha, 'prior α');
    positive(beta, 'prior β');
    integer(successes, 0, 'successes');
    integer(failures, 0, 'failures');
    const a = alpha + successes;
    const b = beta + failures;
    const sum = a + b;
    return { alpha: a, beta: b, mean: a / sum, variance: (a / sum) * (b / sum) / (sum + 1) };
  }

  const api = { rng, model, quantile, binomialPMF, trial, posterior };
  root.LabMath = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(globalThis);


/* discrete-math.js */
/* Integer-valued probability models and their observable experiment steps. */
(function (root) {
  'use strict';

  function integer(value, min, label) {
    if (!Number.isSafeInteger(value) || value < min) {
      throw new RangeError(label + ' must be an integer ≥ ' + min);
    }
  }

    if (!Number.isFinite(p) || p < 0 || p > 1) {
      throw new RangeError('p must be between 0 and 1');
    }
  }

  // at most one, even when either endpoint probability underflows to zero.
  function finiteLaw(min, max, mode, ratio, mean, variance, sample) {
    let masses, prefixes;

      masses = new Float64Array(max - min + 1);
      prefixes = new Float64Array(masses.length);

      for (let k = mode - 1; k >= min; k--) masses[k - min] = masses[k + 1 - min] / ratio(k);
      for (let k = mode + 1; k <= max; k++) masses[k - min] = masses[k - 1 - min] * ratio(k - 1);
      let total = 0;
      for (const weight of masses) total += weight;
      let cdf = 0;
      for (let i = 0; i < masses.length; i++) {
        masses[i] /= total;
        cdf += masses[i];
        prefixes[i] = Math.min(1, cdf);
      }
    }
    return {
      min, max, plotMax: max, mean, variance, sample,
      pmf(k) {
        if (!Number.isInteger(k) || k < min || k > max) return 0;
        tabulate();
        return masses[k - min];
      },
      cdf(x) {
        if (Number.isNaN(x)) return NaN;
        if (x < min) return 0;
        if (x >= max) return 1;
        tabulate();
        return prefixes[Math.floor(x) - min];

  function binomial(n, p) {
    integer(n, 0, 'n');
    probability(p);
    function sample(random, steps) {
      let count = 0;
      for (let i = 0; i < n; i++) {
        const tail = Number(random() < p);
        count += tail;
        if (steps) steps.push(tail);
      }
      return count;
    }

    const mean = n * p;
    if (p === 0 || p === 1 || n === 0) {

        cdf: x => Number.isNaN(x) ? NaN : Number(x >= mean)};

(function(){
'use strict';
window.addDiscreteQuestions = function(add) {
  add('discrete','Turn a sequence into a count','Predict','Three coins land T–H–T. If X counts tails, what is X?',2,'Count each T once.','Two tails give X = 2. H–T–T and T–T–H give the same value.',{choices:['0','1','2','3']});
  add('discrete','Read a jump in the CDF','Calculate','Toss three fair coins. What is P(1 ≤ X ≤ 2), where X counts tails?',.75,'Which of the eight equally likely sequences give one or two tails?','Six sequences qualify. P(1 ≤ X ≤ 2) = F(2) − F(0) = 6/8.',{tol:.001,unit:'Probability'});
  add('discrete','Locate the long-run mean','Experiment','Toss 1,000 sets of three fair coins. Your mean is close to 1.5. Can one set have exactly 1.5 tails?',0,'List the possible values in a single set.','The long-run mean can lie between the possible outcomes. Each set has 0, 1, 2 or 3 tails.',{record:'Record the observed mean.',choices:['No, each set gives an integer.','Yes, once enough sets have been observed.']});

  add('bernoulli','Code one decision','Predict','A trial records success as 1 and failure as 0. If the success probability is p, what is its mean?',1,'Weight each possible value by its probability.','E[X] = 0(1 − p) + 1p = p.',{choices:['1 − p','p','1']});
  add('bernoulli','How variable is one trial?','Calculate','A success occurs with probability 0.2. Find the variance of its 0-or-1 indicator.',.16,'For an indicator, X² = X.','Var(X) = p(1 − p) = 0.2 × 0.8 = 0.16.',{tol:.001,unit:'Variance'});
  add('bernoulli','Watch the success bar','Experiment','Set p to 0.2. Run 1,000 trials. What does the height of the bar at 1 estimate?',0,'One bar counts successes. Divide its count by all trials.','Its height is the observed success fraction. With many independent trials it approaches p.',{record:'Record the success fraction.',choices:['The probability of success on one trial.','The total number of successes.']});

  add('binomial','Fix the trial count','Predict','Which experiment gives a Binomial count?',1,'Look for a fixed trial count and independent decisions with a shared p.','Ten independent decisions with a common p give Binomial(10, p).',{choices:['Draw until the first success.','Count successes in ten independent trials with the same p.','Draw ten items from a small lot without replacement.']});
  add('binomial','Two biased tosses','Calculate','A coin lands heads with probability 0.6. What is the probability of exactly one head in two independent tosses?',.48,'HT and TH both count.','P(X = 1) = 2 × 0.6 × 0.4 = 0.48.',{tol:.001,unit:'Probability'});
  add('binomial','More trials per group','Experiment','Set p = 0.5. Compare 1,000 groups with n = 4 and n = 8. How does the mean count change?',0,'The mean is the sum of n individual success probabilities.','E[X] = np, so the population mean moves from 2 to 4.',{record:'Enter the two observed means.',choices:['It roughly doubles.','It stays at 0.5.','It roughly halves.']});

  add('geometric','Count the successful attempt','Predict','Two attempts fail and the third succeeds. What is the geometric waiting count in this lab?',2,'The count includes the successful trial.','The first success arrives on attempt 3.',{choices:['0','2','3']});
  add('geometric','First six on roll three','Calculate','Roll a fair die until the first six. What is the probability of stopping on roll three?',25/216,'The first two rolls must miss and the third must hit.','P(X = 3) = (5/6)²(1/6) = 25/216.',{tol:.001,unit:'Probability'});
  add('geometric','Make success rarer','Experiment','Compare 1,000 waits with p = 0.5 and p = 0.25. What happens to the mean number of attempts?',0,'The mean count is 1/p.','Halving p doubles the expected attempts, from 2 to 4.',{record:'Record the two sample means.',choices:['It roughly doubles.','It stays fixed.','It roughly halves.']});

  add('hypergeometric','Update the bag','Predict','A bag holds 3 marked and 7 plain items. You remove a marked item. What is the chance of drawing another marked item next?',1,'Update both the marked count and the total.','Two marked items remain among nine, giving 2/9.',{choices:['3/10','2/9','3/9']});
  add('hypergeometric','Two marked items','Calculate','Draw two items without replacement from a lot containing 3 marked and 7 plain items. What is P(both marked)?',1/15,'Multiply the chance on the first draw by the conditional chance on the second.','(3/10)(2/9) = 1/15.',{tol:.001,unit:'Probability'});
  add('hypergeometric','Inspect the whole lot','Experiment','Draw every item in the lot. Repeat. What happens to the count of marked items?',2,'Only the order changes when you inspect the entire lot.','Every full inspection returns exactly K marked items. Its variance is zero.',{record:'Enter the lot size and the observed count.',choices:['It has the largest variance.','It depends on the draw order.','It is identical every time.']});

  add('poisson','A count or a wait?','Predict','A bank records the number of arrivals in the next hour. Which observation belongs in the Poisson histogram?',0,'Identify the unit on the horizontal axis.','Record one integer count per window. The time between arrivals is a different random variable.',{choices:['Four arrivals.','Twelve minutes until an arrival.']});
  add('poisson','Five customers in two hours','Calculate','Customers arrive at 2 per hour in a homogeneous Poisson process. What is P(exactly 5 arrivals in 2 hours)?',Math.exp(-4)*4**5/120,'First convert the rate to a mean count for the whole window.','The mean is 4. P(X = 5) = exp(−4)4⁵/5! ≈ 0.1563.',{tol:.001,unit:'Probability'});
  add('poisson','Double the time window','Experiment','Keep the rate fixed and double the window length. Compare two 1,000-window batches. What happens to the mean count?',0,'At rate λ, a window of length t has mean count λt.','Twice the exposure gives twice the expected count. The Poisson variance also doubles.',{record:'Record both window lengths and sample means.',choices:['It roughly doubles.','It stays fixed.','It grows fourfold.']});
};
})();

        });
        filter();
        stopHero = heroBoard();
        if (location.hash === '#experiments')
            requestAnimationFrame(() => $('#experiments')?.scrollIntoView({ behavior: 'instant' }));
    }
    function heroBoard(){
const canvas=$('#hero-canvas'), ctx=canvas.getContext('2d'), rng=LabMath.rng('home-pegboard');
const drop=$('#hero-drop'), caption=$('#hero-result'), count=$('#hero-count');
const rows=6, bins=Array(rows+1).fill(0), duration=2450;
const media=matchMedia('(prefers-reduced-motion: reduce)');
const roll=()=>LabMath.trial('galton',{n:rows,p:.5},rng);
let last, active=null, elapsed=0, previous=0, raf=0, total=0;
function record(trial){bins[trial.k]++;total++;last=trial}
for(let i=0;i<12;i++)record(roll());
function message(text){if(caption.textContent!==text)caption.textContent=text}
function draw(){
  const r=canvas.getBoundingClientRect(),w=r.width,h=r.height;
  if(!w||!h)return;
  const dpr=Math.min(devicePixelRatio||1,2);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const dx=Math.min((w-16)/7.6,52),cx=w/2,radius=Math.max(2.4,Math.min(4.8,dx*.115));
  const top=13,stackH=Math.max(36,h*.28),base=h-20,bottom=base-stackH-7,dy=(bottom-top)/rows;
  const maxCount=Math.max(...bins,4),unit=Math.min(13,stackH/Math.max(1,maxCount+1));
  const xAt=(k,row)=>cx+(k-row/2)*dx;
  const circle=(x,y,rad,fill)=>{ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill()};
  const stroke=(pts,color,weight)=>{ctx.strokeStyle=color;ctx.lineWidth=weight;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()};
  for(let j=0;j<rows;j++)for(let k=0;k<=j;k++)circle(xAt(k,j),top+j*dy,Math.min(2.8,dx*.076),'#96b8a6');
  const tr=active||last,pos=active?Math.min(rows+1,(rows+1)*elapsed/duration):rows+1;
  const completed=Math.min(rows,Math.floor(pos));
  let rights=0,points=[[cx,top-radius]];
  for(let j=0;j<completed;j++){rights+=tr.steps[j];points.push([xAt(rights,j+1),top+(j+1)*dy-radius])}
  let x=points[points.length-1][0],y=points[points.length-1][1];
  if(completed<rows){
    const f=pos-completed;
    x+=(tr.steps[completed]-.5)*dx*f;
    y+=dy*f-Math.sin(Math.PI*f)*4;
  }else{
    const f=Math.min(1,pos-rows),level=bins[tr.k]-(active?0:1);
    const landing=base-unit*(level+.5);
    y+=f*(landing-y);
  }
  points.push([x,y]);stroke(points,active?'#ecaf72':'#81a698',active?2.2:1.5);
  for(let k=0;k<bins.length;k++){
    const bx=xAt(k,rows),highlight=!active&&k===last.k;
    if(highlight){ctx.fillStyle='#96c2aa22';ctx.fillRect(bx-dx*.46,base-stackH-1,dx*.92,stackH+2)}
    stroke([[bx-dx*.48,base-stackH-2],[bx-dx*.48,base+1],[bx+dx*.48,base+1]],'#618b76',1);
    // Draw every landed ball at the bottom of its own bin.
    for(let j=0;j<bins[k];j++){
      const newest=highlight&&j===bins[k]-1;
      const ballY=base-(j+.5)*unit, ballR=Math.max(.45,Math.min(6.2,unit*.46,dx*.27));
      circle(bx,ballY,ballR,newest?'#ffb16b':'#95bca3');
      if(ballR>3)circle(bx-ballR*.29,ballY-ballR*.24,ballR*.24,newest?'#ffe5b8':'#c4ddc9');
    }
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.font=`${highlight?'bold ':''}${Math.max(10,Math.min(13,dx*.32))}px "Segoe UI",sans-serif`;
    ctx.fillStyle=highlight?'#ffd8a4':'#c2d7c8';ctx.fillText(String(k),bx,base+15);
  }
  if(active){circle(x,y,radius+1.6,'#103e37');circle(x,y,radius,'#ffb16b');circle(x-radius*.3,y-radius*.32,radius*.26,'#ffe3ba')}
  count.textContent=`${total} balls`;
  if(!active)message(`Bin ${last.k} now holds ${bins[last.k]} ${bins[last.k]===1?'ball':'balls'}.`);
  else if(completed<rows){message(completed===0?'Watch the orange ball.':tr.steps[completed-1]?'It bounced right.':'It bounced left.')}
  else message(`It’s landing in bin ${tr.k}.`);
  canvas.setAttribute('aria-label',`${caption.textContent} Each dot in a bin is one ball.`);
}
function finish(){record(active);active=null;previous=0;drop.disabled=false;drop.innerHTML=LabUI.icon('play')+'Drop a ball';draw()}
function tick(time){
  if(!active)return;
  if(previous)elapsed+=Math.max(0,time-previous);
  previous=time;
  if(elapsed>=duration||media.matches){finish();return}
  draw();raf=requestAnimationFrame(tick);
}
drop.onclick=()=>{
  if(active)return;
  active=roll();elapsed=0;previous=0;
  if(media.matches){finish();return}
  drop.disabled=true;drop.textContent='Falling…';draw();raf=requestAnimationFrame(tick);
};
const observer=new ResizeObserver(draw);observer.observe(canvas);draw();
return ()=>{cancelAnimationFrame(raf);observer.disconnect()};
}
    function side() {
        document.body.classList.toggle('instructor', config.instructor);
        $('#lecture-side').innerHTML = `<button class="btn side-toggle" style="display:none">Lecture navigation</button><div class="side-body"><p class="eyebrow">Lecture navigation</p>${cards.map(c => `<a href="${link(c[0])}" ${current === c[0] ? 'aria-current="page"' : ''}>${c[3]}</a>`).join('')}<p class="eyebrow">Lecture flow</p>${sections.map((s, i) => `<div class="small">${s[0]} · ${config.times[i]} min</div>`).join('')}</div>`;
        $('.side-toggle').onclick = () => $('#lecture-side').classList.toggle('open');
    }
    function setupDialog() {
        const el = $('#instructor-dialog');
        $('#instructor-body').innerHTML = `<div class="row spread"><h2 id="instructor-title">Instructor tools</h2><button class="icon-button" id="dlg-close" aria-label="Close instructor tools">${icon('close')}</button></div><div class="instructor-fields"><label><input type="checkbox" id="proj" ${config.instructor ? 'checked' : ''}> Projector typography and lecture navigation</label><label><input type="checkbox" id="hide" ${config.hide ? 'checked' : ''}> Hide formulas and theory at the start of each experiment</label><h3>Lecture flow</h3><div class="schedule">${sections.map((s, i) => `<label for="time${i}">${s[0]}</label><input type="number" id="time${i}" data-time="${i}" min="1" max="240" value="${config.times[i]}" aria-label="${s[0]} minutes">`).join('')}</div><p class="small" id="total-time"></p><div class="actions"><button class="btn primary" id="dlg-done">Done</button><button class="btn" id="fullscreen">${icon('full')}Full screen</button></div></div>`;
        const total = () => {
            $('#total-time').textContent = config.times.reduce((a, b) => a + b, 0) + ' minutes in total, including the break.';
        };
        total();
        $('#dlg-close').onclick = $('#dlg-done').onclick = () => el.close();
        $('#proj').onchange = e => {
            config.instructor = e.target.checked;
            save('instructor', config.instructor);
            side();
        };
        $('#hide').onchange = e => {
            config.hide = e.target.checked;
            save('hide', config.hide);
            window.LabRun?.setHide?.(config.hide);
            window.DiscreteLab?.setHide?.(config.hide);
            window.LabIntro.setHidden(config.hide);
        };
        el.querySelectorAll('[data-time]').forEach(e => e.onchange = () => {
            config.times[+e.dataset.time] = Math.round(Math.max(1, Math.min(240, +e.value || 1)));
            e.value = config.times[+e.dataset.time];
            save('times-combined', config.times);
            side();
            total();
        });
        $('#fullscreen').onclick = () => {
            el.close();
            full(document.documentElement);
        };
        el.showModal();
    }
    async function full(el) {
        try {
            if (document.fullscreenElement)
                await document.exitFullscreen();
            else
                await el.requestFullscreen();
        }
        catch {
            window.alert('Your browser could not enter full screen. Use its full-screen command to project this page.');
        }
    }
    function theme() {
        const dark = document.documentElement.classList.contains('dark');
        $('#theme').innerHTML = icon(dark ? 'sun' : 'moon');
        $('#theme').setAttribute('aria-label', dark ? 'Use light theme' : 'Use dark theme');
    }
    function route() {
        if (location.hash === '#content') {
            document.getElementById('content').focus();
            return;
        }
        stopHero();
        stopHero = () => { };
        window.LabRun?.dispose();
        window.DiscreteLab?.dispose();
        window.DiscreteExplorer?.dispose();
        window.LabExtras?.dispose();
        const parts = location.hash.slice(1).split('/'), page = parts[0] || 'home';
        current = page === 'lab' ? parts[1] : page;
        const nav = page === 'explorer' || page === 'challenges' ? page : 'experiments';
        document.querySelectorAll('[data-nav]').forEach(a => {
            if (a.dataset.nav === nav)
                a.setAttribute('aria-current', 'page');
            else
                a.removeAttribute('aria-current');
        });
        side();
        window.scrollTo({ top: 0, behavior: 'instant' });
        const el = $('#content');
        if (page === 'explorer' && parts[1] === 'discrete')
            DiscreteExplorer.mount(el);
        else if (page === 'explorer')
            LabExtras.explorer(el);
        else if (page === 'challenges')
            LabExtras.challenges(el, parts[1]);
        else if (page === 'lab' && Object.hasOwn(DiscreteLab.names, parts[1]))
            DiscreteLab.mount(el, parts[1], parts[2] === 'demo');
        else if (page === 'lab' && Object.hasOwn(LabRun.names, parts[1]))
            LabRun.mount(el, parts[1], parts[2] === 'demo');
        else
            home();
        document.title = (page === 'lab' && (LabRun.names[parts[1]] || DiscreteLab.names[parts[1]]) ? (LabRun.names[parts[1]] || DiscreteLab.names[parts[1]]) + ' · ' : page === 'explorer' ? 'Distribution explorer · ' : page === 'challenges' ? 'Lecture challenges · ' : '') + 'Probability in the Real World';
    }
    window.LabUI = { icon, config, full, link };
    document.documentElement.classList.toggle('dark', read('dark', false));
    theme();
    $('#theme').onclick = () => {
        const dark = document.documentElement.classList.toggle('dark');
        save('dark', dark);
        theme();
        window.dispatchEvent(new Event('labtheme'));
    };
    document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = icon(e.dataset.icon));
    $('#instructor-open').onclick = setupDialog;
    document.querySelector('.skip').onclick = e => {
        e.preventDefault();
        $('#content').focus();
    };
    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', route);
})();
</script>
</body></html>
